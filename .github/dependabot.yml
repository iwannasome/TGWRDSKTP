version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Europe/Moscow
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Europe/Moscow
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
