name: Нативные сборки TGWR

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Release ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            command: dist:linux
          - os: windows-2025
            name: windows-x64
            command: dist:win
          - os: macos-15-intel
            name: macos-x64
            command: dist:mac
          - os: macos-15
            name: macos-arm64
            command: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run release:version-check
      - run: python -m pip install -r worker/requirements-build.txt
      - run: npm run typecheck
      - run: npm run test:worker
      - run: npm run ${{ matrix.command }}
      - name: Проверить запуск packaged app и перезапуск worker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a npm run app:smoke
      - name: Проверить запуск packaged app и перезапуск worker
        if: runner.os != 'Linux'
        run: npm run app:smoke
      - name: Сформировать SHA-256
        run: node scripts/generate-checksums.mjs "release/SHA256SUMS-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TGWR-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Подготовить черновик GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: TGWR-*
          path: release
          merge-multiple: true
      - name: Собрать общую SHA-256 ведомость
        run: node scripts/generate-checksums.mjs
      - name: Создать черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes --title "TGWR by IWS $GITHUB_REF_NAME"
