name: Нативные сборки TGWR

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-credentials:
    name: Проверить сертификаты stable-релиза
    runs-on: ubuntu-24.04
    env:
      TGWR_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Не допустить неподписанный stable-тег
        shell: bash
        run: |
          if [ "$TGWR_TAG_RELEASE" != "true" ]; then
            echo "Ручной прогон собирает проверочные artifacts без требования сертификатов."
            exit 0
          fi

          missing=()
          for name in \
            WIN_CSC_LINK WIN_CSC_KEY_PASSWORD \
            MAC_CSC_LINK MAC_CSC_KEY_PASSWORD \
            APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Для stable-релиза отсутствует GitHub Secret %s\n' "${missing[@]}"
            exit 1
          fi

          echo "Все секреты подписи Windows и notarization macOS доступны."

  quality:
    name: Полный release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Разрешить релизный тег только с вершины master
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch origin master --no-tags
          if [ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]; then
            echo "Релизный тег должен указывать на текущую вершину origin/master" >&2
            exit 1
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r worker/requirements-runtime.txt
      - run: npm audit --audit-level=high
      - run: npm run release:version-check
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run test:worker
      - name: Полный synthetic и browser smoke
        run: npm run test:synthetic
        env:
          CHROME_BIN: /usr/bin/google-chrome
          TGWR_SMOKE_ALL_SLIDES: "1"
          PYTHONWARNINGS: error::DeprecationWarning

  build:
    name: Release ${{ matrix.name }}
    needs: [release-credentials, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
            command: dist:linux
          - os: windows-2025
            name: windows-x64
            command: dist:win
          - os: macos-15-intel
            name: macos-x64
            command: dist:mac
          - os: macos-15
            name: macos-arm64
            command: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run release:version-check
      - run: python -m pip install -r worker/requirements-build.txt
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run test:worker
      - name: Собрать Linux artifacts
        if: runner.os == 'Linux'
        run: npm run ${{ matrix.command }}
      - name: Собрать неподписанный Windows installer для проверки
        if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/v')
        run: npm run ${{ matrix.command }}
      - name: Собрать и подписать stable Windows installer
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        run: npm run ${{ matrix.command }}
        env:
          TGWR_REQUIRE_CODE_SIGNING: "1"
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Собрать неподписанный macOS DMG для проверки
        if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/v')
        run: npm run ${{ matrix.command }}
      - name: Подготовить App Store Connect API key
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_BASE64" | python3 -c 'import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read(), validate=True))' > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Собрать, подписать и notarize stable macOS DMG
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: npm run ${{ matrix.command }}
        env:
          TGWR_REQUIRE_CODE_SIGNING: "1"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Проверить Authenticode stable-installer
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/*.exe)
          if ($installers.Count -eq 0) {
            throw "Windows installer не найден"
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Недействительная Authenticode-подпись $($installer.Name): $($signature.Status)"
            }
            Write-Host "Authenticode подтверждён: $($installer.Name)"
          }
      - name: Проверить подпись и notarization stable-DMG
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app_path="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "TGWR.app не найден внутри release" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"

          found_dmg=0
          for dmg in release/*.dmg; do
            if [ ! -f "$dmg" ]; then
              continue
            fi
            found_dmg=1
            mount_dir="$(mktemp -d)"
            cleanup_mount() {
              hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
              rmdir "$mount_dir" >/dev/null 2>&1 || true
            }
            trap cleanup_mount EXIT
            hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly -quiet
            shipped_app="$(find "$mount_dir" -maxdepth 2 -type d -name '*.app' -print -quit)"
            if [ -z "$shipped_app" ]; then
              echo "Приложение не найдено внутри $dmg" >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$shipped_app"
            xcrun stapler validate "$shipped_app"
            cleanup_mount
            trap - EXIT
          done
          if [ "$found_dmg" -ne 1 ]; then
            echo "macOS DMG не найден" >&2
            exit 1
          fi
      - name: Удалить временный App Store Connect API key
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -n "${APPLE_API_KEY:-}" ]; then
            rm -f -- "$APPLE_API_KEY"
          fi
      - name: Проверить запуск packaged app и перезапуск worker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a npm run app:smoke
      - name: Проверить запуск packaged app и перезапуск worker
        if: runner.os != 'Linux'
        run: npm run app:smoke
      - name: Установить, запустить и удалить готовый Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem release/*.exe | Where-Object { $_.Name -like '*Setup*' })
          if ($installer.Count -ne 1) {
            throw "Ожидался один Windows installer, найдено: $($installer.Count)"
          }

          $installRoot = Join-Path $env:RUNNER_TEMP 'tgwr-nsis-smoke'
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S /currentuser /D=$installRoot" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer завершился с кодом $($install.ExitCode)"
          }

          $app = @(Get-ChildItem $installRoot -Recurse -File -Filter 'TGWR by IWS.exe')
          if ($app.Count -ne 1) {
            throw "После NSIS-установки ожидался один TGWR by IWS.exe, найдено: $($app.Count)"
          }

          try {
            $env:TGWR_SMOKE_EXECUTABLE = $app[0].FullName
            npm run app:smoke
            if ($LASTEXITCODE -ne 0) {
              throw "Установленное Windows-приложение не прошло app:smoke"
            }
          } finally {
            Remove-Item Env:TGWR_SMOKE_EXECUTABLE -ErrorAction SilentlyContinue
            $uninstaller = @(Get-ChildItem $installRoot -Recurse -File -Filter 'Uninstall *.exe')
            if ($uninstaller.Count -eq 1) {
              $uninstall = Start-Process -FilePath $uninstaller[0].FullName -ArgumentList '/S --delete-app-data' -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) {
                throw "NSIS uninstaller завершился с кодом $($uninstall.ExitCode)"
              }
            } else {
              throw "После установки не найден единственный NSIS uninstaller"
            }
          }

          if (Test-Path $app[0].FullName) {
            throw "NSIS uninstaller оставил основной executable"
          }
          Write-Host "nsis_artifact_smoke=ok install=completed app=started uninstall=completed"
      - name: Смонтировать и запустить приложение из готового macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Ожидался один macOS DMG, найдено: ${#dmgs[@]}" >&2
            exit 1
          fi

          mount_dir="$(mktemp -d "$RUNNER_TEMP/tgwr-dmg-smoke.XXXXXX")"
          cleanup_mount() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach "${dmgs[0]}" -mountpoint "$mount_dir" -nobrowse -readonly -quiet

          shipped_apps=("$mount_dir"/*.app)
          if [ "${#shipped_apps[@]}" -ne 1 ]; then
            echo "В DMG ожидалось одно приложение, найдено: ${#shipped_apps[@]}" >&2
            exit 1
          fi
          shipped_executable="${shipped_apps[0]}/Contents/MacOS/TGWR by IWS"
          if [ ! -x "$shipped_executable" ]; then
            echo "В DMG отсутствует исполняемый TGWR by IWS" >&2
            exit 1
          fi

          TGWR_SMOKE_EXECUTABLE="$shipped_executable" npm run app:smoke
          echo "dmg_artifact_smoke=ok mount=readonly app=started"
      - name: Извлечь и запустить приложение из готового Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(release/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "Ожидался один Linux AppImage, найдено: ${#appimages[@]}" >&2
            exit 1
          fi

          extract_dir="$(mktemp -d "$RUNNER_TEMP/tgwr-appimage-smoke.XXXXXX")"
          chmod +x "${appimages[0]}"
          (
            cd "$extract_dir"
            "$GITHUB_WORKSPACE/${appimages[0]}" --appimage-extract >/dev/null
          )
          artifact_executable="$extract_dir/squashfs-root/tgwr"
          if [ ! -x "$artifact_executable" ]; then
            echo "После извлечения AppImage отсутствует executable tgwr" >&2
            exit 1
          fi

          sudo chown root:root "$extract_dir/squashfs-root/chrome-sandbox"
          sudo chmod 4755 "$extract_dir/squashfs-root/chrome-sandbox"
          TGWR_SMOKE_EXECUTABLE="$artifact_executable" xvfb-run -a npm run app:smoke
          echo "appimage_artifact_smoke=ok extract=completed app=started"
      - name: Сформировать SHA-256
        run: node scripts/generate-checksums.mjs "release/SHA256SUMS-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: TGWR-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Подготовить черновик GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: TGWR-*
          path: release
          merge-multiple: true
      - name: Собрать общую SHA-256 ведомость
        run: node scripts/generate-checksums.mjs
      - name: Создать черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes --title "TGWR by IWS $GITHUB_REF_NAME"
