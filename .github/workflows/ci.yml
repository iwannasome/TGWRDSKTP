name: Проверка TGWR

on:
  push:
    branches: [master, "fix/**", "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Метрики, fixtures и интерфейс
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r worker/requirements-runtime.txt
      - run: npm audit --audit-level=high
      - run: npm run release:version-check
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run test:worker
      - name: Полный synthetic и browser smoke
        run: npm run test:synthetic
        env:
          CHROME_BIN: /usr/bin/google-chrome
          TGWR_SMOKE_ALL_SLIDES: "1"
          PYTHONWARNINGS: error::DeprecationWarning

  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: windows-2025
            name: windows-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run release:version-check
      - run: python -m pip install -r worker/requirements-build.txt
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run test:worker
      - run: npm run build
      - run: npm run worker:build
      - run: npm run worker:smoke
      - run: npm run pack:app
      - run: npm run package:check
      - name: Проверить связь Electron с packaged worker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a npm run app:smoke
      - name: Проверить запуск packaged app и перезапуск worker
        if: runner.os != 'Linux'
        run: npm run app:smoke
